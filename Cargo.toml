[workspace]
resolver = "3"
members = [
    "crates/bacnet-types",
    "crates/bacnet-encoding",
    "crates/bacnet-services",
    "crates/bacnet-mstp-codec",
    "crates/bacnet-mstp-core",
    "crates/bacnet-router-core",
    "crates/bacnet-router-adapters",
    "crates/bacnet-bip-codec",
    "crates/bacnet-transport",
    "crates/bacnet-network",
    "crates/bacnet-endpoint-core",
    "crates/bacnet-client",
    "crates/bacnet-runtime",
    "crates/bacnet-objects",
    "crates/bacnet-server",
    "crates/bacnet-endpoint",
    "crates/bacnet-integration-tests",
    "crates/rusty-bacnet",
    "crates/bacnet-cli",
    "benchmarks",
    # The sample programs (publish = false), which share this Cargo.lock (#1450).
    # Listed one by one: with a glob, a leftover directory there without a
    # Cargo.toml would break every cargo command in the workspace.
    "examples/rust/samples/bacnet-write",
    "examples/rust/samples/mini-device-revisited",
    "examples/rust/samples/point-discover",
    "examples/rust/samples/rpm-read",
    "examples/rust/samples/whois-scan",
]
# rusty-bacnet's tests link libpython, so they need a Python with its shared library.
# bacnet-cli has heavy deps (rustyline, clap) — excluded from default builds.
# Use `cargo nextest run -p rusty-bacnet`. The samples are left out too:
# `--workspace` runs build them, and `-p <sample>` picks one.
default-members = [
    "crates/bacnet-types",
    "crates/bacnet-encoding",
    "crates/bacnet-services",
    "crates/bacnet-mstp-codec",
    "crates/bacnet-mstp-core",
    "crates/bacnet-router-core",
    "crates/bacnet-router-adapters",
    "crates/bacnet-bip-codec",
    "crates/bacnet-transport",
    "crates/bacnet-network",
    "crates/bacnet-endpoint-core",
    "crates/bacnet-client",
    "crates/bacnet-runtime",
    "crates/bacnet-objects",
    "crates/bacnet-server",
    "crates/bacnet-endpoint",
    "crates/bacnet-integration-tests",
    "benchmarks",
]

[workspace.package]
version = "0.12.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
authors = ["Justin Scott <jscott3201@gmail.com>"]
repository = "https://github.com/jscott3201/rusty-bacnet"
homepage = "https://github.com/jscott3201/rusty-bacnet"
keywords = ["bacnet", "building-automation", "ashrae", "iot", "protocol"]
categories = ["network-programming", "embedded"]

[workspace.dependencies]
# The no_std crates build without std on bare-metal targets (#1604), so their
# entries, and those of thiserror and bytes, leave default features off:
# cargo ignores `default-features = false` on a member's `workspace = true`
# edge, so only the entry can. Hosted crates turn std back on with
# `features = ["std"]` on each edge. tracing keeps its defaults: only
# bacnet-encoding's `std` feature brings it into a no_std crate.
bacnet-types = { version = "0.12.0", path = "crates/bacnet-types", default-features = false }
bacnet-encoding = { version = "0.12.0", path = "crates/bacnet-encoding", default-features = false }
bacnet-services = { version = "0.12.0", path = "crates/bacnet-services", default-features = false }
bacnet-mstp-codec = { version = "0.12.0", path = "crates/bacnet-mstp-codec", default-features = false }
bacnet-mstp-core = { version = "0.12.0", path = "crates/bacnet-mstp-core", default-features = false }
bacnet-router-core = { version = "0.12.0", path = "crates/bacnet-router-core", default-features = false }
bacnet-router-adapters = { version = "0.12.0", path = "crates/bacnet-router-adapters", default-features = false }
bacnet-bip-codec = { version = "0.12.0", path = "crates/bacnet-bip-codec", default-features = false }
bacnet-transport = { version = "0.12.0", path = "crates/bacnet-transport" }
bacnet-network = { version = "0.12.0", path = "crates/bacnet-network" }
bacnet-endpoint-core = { version = "0.12.0", path = "crates/bacnet-endpoint-core" }
bacnet-client = { version = "0.12.0", path = "crates/bacnet-client" }
bacnet-runtime = { version = "0.12.0", path = "crates/bacnet-runtime" }
bacnet-objects = { version = "0.12.0", path = "crates/bacnet-objects" }
bacnet-server = { version = "0.12.0", path = "crates/bacnet-server" }
bacnet-endpoint = { version = "0.12.0", path = "crates/bacnet-endpoint" }
thiserror = { version = "2", default-features = false }
bitflags = "2"
bytes = { version = "1", default-features = false }
tracing = "0.1"
tokio = "1"
socket2 = "0.6"
# maturin turns on extension-module for wheel builds (crates/rusty-bacnet/pyproject.toml);
# without it, cargo links libpython so the crate's own tests can run (#919).
pyo3 = { version = "0.29", features = ["multiple-pymethods"] }
# No TLS features: BACnet/SC runs its own tokio-rustls handshake against the
# configured trust anchors and hands tungstenite the TLS stream. A tungstenite
# TLS feature would add native root loading, which links Apple's Security
# framework on macOS and so stops the zig cross-build of the release (#944).
tokio-tungstenite = "0.29"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std"] }
futures-util = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
smallvec = "1"
serde = { version = "1", default-features = false }
serde_json = "1"
sha2 = "0.10"
criterion = { version = "0.8", features = ["async_tokio"] }
sysinfo = "0.39"
libc = "0.2"
getrandom = "0.3"
# 0.9.0 was yanked.
heapless = "0.9.1"
proptest = "1"

[workspace.lints.rust]
# Workspace floor. `bacnet-transport` overrides nothing: each FFI site
# carries `#[allow(unsafe_code)]` and a `// SAFETY:` comment, so this
# stays `deny` everywhere.
unsafe_code = "deny"
# Every public item is documented (#902); bacnet-benchmarks (publish = false)
# opts out in its lib.rs.
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
