[package]
name = "bip-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
bacnet-client = { git = "https://github.com/jscott3201/rusty-bacnet", branch = "dev" }
bacnet-encoding = { git = "https://github.com/jscott3201/rusty-bacnet", branch = "dev" }
bacnet-network = { git = "https://github.com/jscott3201/rusty-bacnet", branch = "dev" }
bacnet-objects = { git = "https://github.com/jscott3201/rusty-bacnet", branch = "dev" }
bacnet-server = { git = "https://github.com/jscott3201/rusty-bacnet", branch = "dev" }
bacnet-services = { git = "https://github.com/jscott3201/rusty-bacnet", branch = "dev" }
bacnet-transport = { git = "https://github.com/jscott3201/rusty-bacnet", branch = "dev" }
bacnet-types = { git = "https://github.com/jscott3201/rusty-bacnet", branch = "dev" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
