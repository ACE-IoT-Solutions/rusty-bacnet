[package]
name = "bacnet-router-core"
description = "Portable no-std BACnet router (Clause 6): a sans-IO routing engine over a borrowed NPDU view and writer, network-layer messages, a routing table and route discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["bacnet", "router", "npdu", "embedded", "no-std"]
categories = ["embedded", "network-programming", "no-std"]

# The table, discovery and the engine's scratch live in caller-sized arrays
# (const generics), and NPDUs are borrowed or written into caller storage,
# so the crate needs neither std nor an allocator, and has no features.
[dependencies]
bacnet-time = { workspace = true }

# bacnet-encoding's decoder is the reference the NPDU view is held equal to,
# and bacnet-types holds the constants the message codes must match. Tests
# only: the crate itself never links either.
[dev-dependencies]
bacnet-encoding = { workspace = true, features = ["std"] }
bacnet-types = { workspace = true, features = ["std"] }
bytes = { workspace = true }
proptest.workspace = true

[package.metadata.docs.rs]
# Built for a bare-metal target too, so the docs show the crate without std.
targets = ["x86_64-unknown-linux-gnu", "thumbv7em-none-eabihf"]

[lints]
workspace = true
