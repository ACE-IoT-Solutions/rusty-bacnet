[package]
name = "bip-codec-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]
members = []

[dependencies]
libfuzzer-sys = "0.4"
bacnet-bip-codec = { path = ".." }

[[bin]]
name = "bip_decode"
path = "fuzz_targets/bip_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bip6_decode"
path = "fuzz_targets/bip6_decode.rs"
test = false
doc = false
bench = false
