[package]
name = "bacnet-mstp-codec"
description = "Portable no-std BACnet MS/TP frame codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["bacnet", "mstp", "embedded", "no-std"]
categories = ["embedded", "network-programming", "no-std"]

# No feature needs std: each one only adds a FrameSink impl.
[features]
default = []
alloc = []
bytes = ["alloc", "dep:bytes"]
heapless = ["dep:heapless"]

[dependencies]
# Not the workspace entry, which keeps bytes' default std feature.
bytes = { version = "1", default-features = false, optional = true }
heapless = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
