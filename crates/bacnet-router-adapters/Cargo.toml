[package]
name = "bacnet-router-adapters"
description = "Allocation-free data-link adapters for the embedded BACnet router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["bacnet", "router", "mstp", "embedded", "no-std"]
categories = ["embedded", "network-programming", "no-std"]

[features]
default = []

[dependencies]
bacnet-mstp-core = { workspace = true }
bacnet-router-core = { workspace = true }

[dev-dependencies]
bacnet-mstp-core = { workspace = true, features = ["heapless"] }
bacnet-mstp-codec = { workspace = true }

[lints]
workspace = true
