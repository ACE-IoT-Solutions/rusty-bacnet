[package]
name = "bacnet-encoding"
description = "BACnet ASN.1/BER encoding, APDU and NPDU codecs per ASHRAE 135-2020"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["bacnet", "asn1", "encoding", "apdu", "npdu"]
categories = ["network-programming", "encoding"]

[features]
# Keep the existing host-facing behavior as the default while allowing the
# codecs to be built for alloc-backed embedded targets.
default = ["std"]
std = ["alloc", "bacnet-types/std", "bytes/std", "dep:tracing"]
alloc = []

[dependencies]
bacnet-types = { workspace = true, default-features = false }
bytes = { workspace = true, default-features = false }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
