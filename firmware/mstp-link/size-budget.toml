# Size budget for the MS/TP firmware link test's image (#1626), in octets.
# scripts/ci/check-firmware-link.sh builds the image with the `firmware`
# profile for each target below and fails when a section outgrows its budget,
# or when more core::fmt functions are linked in than `fmt_functions` allows.
#
# Each budget is the size measured when it was set plus 12%, rounded up to 16
# octets, as the check's error message suggests. .data is empty, so it gets a
# token 64 octets: a static with a nonzero initial value lands there, and
# costs flash for its initial image as well as RAM. The scenario's storage
# and the master core are statics in .bss. Raising a budget is a reviewed
# change: say why the image grew. See docs/ci.md, "Firmware link test", and
# firmware_size.py for the syntax this file may use.

# Cortex-M3. Measured 2026-10-11 with Rust 1.99.0: text 19184, rodata 1004,
# data 0, bss 14504.
[thumbv7m-none-eabi]
text = 21488
rodata = 1136
data = 64
bss = 16256
fmt_functions = 0

# Cortex-M0/M0+. Measured 2026-10-11 with Rust 1.99.0: text 19488, rodata
# 1004, data 0, bss 14504.
[thumbv6m-none-eabi]
text = 21840
rodata = 1136
data = 64
bss = 16256
fmt_functions = 0

# RV32IMC, the ESP32-C3 class. Measured 2026-10-11 with Rust 1.99.0: text
# 20344, rodata 1292, data 0, bss 14502.
[riscv32imc-unknown-none-elf]
text = 22800
rodata = 1456
data = 64
bss = 16256
fmt_functions = 0
