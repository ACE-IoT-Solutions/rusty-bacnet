# Size budget for the firmware link test's images (#1626, #1635), in octets:
# one table per target and image, `[<target>.<image>]`.
# scripts/ci/check-firmware-link.sh builds the images with the `firmware`
# profile and fails when a size outgrows its budget, or when more core::fmt
# functions are linked in than `fmt_functions` allows, or more 64-bit
# division routines than `div64_functions` allows.
#
# - text, rodata, data, bss: those sections.
# - flash: every loaded section with contents, .data's initial image
#   included (on Cortex-M, also the 1 KB or 192 B vector table).
# - ram: every loaded writable section; riscv-rt's .stack, which fills
#   whatever RAM is left, doesn't count, but its .heap (`_heap_size`, 0
#   here) does. The alloc image's heap is a 1 KiB static arena in .bss
#   (`firmware_link::apdu::ARENA`). The stack the code uses at run time
#   isn't measured.
# - fmt_functions, div64_functions: counts of functions, not octets, 0 for
#   mstp and bip. A 64-bit division by a runtime value links
#   compiler-builtins' routine, about 0.9 KB, which the 12% headroom would
#   otherwise absorb; the MS/TP core divides in 32 bits (#1618). The alloc
#   image's counts are what it links today, with no headroom, so a new
#   function fails the check. Its libraries build error messages with
#   format!, which brings in core::fmt (15 functions, about 2.7 KB of text
#   on ARMv7-M). On ARMv6-M, which has no multiply with a 64-bit product,
#   formatting a u64 divides by a constant through the 64-bit division
#   routine (3 functions).
#
# The totals go by section flags, not memory regions, and leave out the
# alignment gaps between sections (at most 4 octets of flash per image today).
#
# Each budget is the size measured when it was set plus 12%, rounded up to
# 16 octets: what `check-firmware-link.sh --suggest` prints. .data is empty,
# so it gets a token 64 octets: a static with a nonzero initial value lands
# there, and costs flash for its initial image as well as RAM. Raising a
# budget is a reviewed change: say why the image grew. Re-measure after a
# toolchain bump. See docs/ci.md, "Firmware link test", and firmware_size.py
# for the syntax this file may use.
#
# Measured 2026-10-11 with Rust 1.99.0, as text / rodata / data / bss, then
# flash / ram:
#
#   thumbv7m mstp     16468 / 1004 / 0 /  5544   18496 /  5544
#   thumbv7m bip       8936 /  976 / 0 /   132   10936 /   132
#   thumbv6m mstp     17340 / 1004 / 0 /  5544   18536 /  5544
#   thumbv6m bip      10468 /  980 / 0 /   132   11640 /   132
#   riscv32imc mstp   17852 / 1292 / 0 /  5544   19166 /  5544
#   riscv32imc bip    11820 / 1524 / 0 /   132   13366 /   132
#   thumbv7m alloc    37476 / 5188 / 0 /  1056   43688 /  1056
#   thumbv6m alloc    39912 / 5188 / 0 /  1056   45292 /  1056
#   riscv32imc alloc  45328 / 5832 / 0 /  1056   51182 /  1056
#
# The bip rows were measured again on 2026-10-11, same toolchain, when the
# image gained the B/IPv6 codec's scenario (#1621): about 4.6-6.0 KB more
# flash, the RAM unchanged. The mstp rows were too, when the master core
# began waiting for a quiet line before each send (#1618, #1625), and again
# when the core began borrowing its large buffers, dropped its control
# ring and its 64-bit divisions, and the image switched to building the
# core on the stack (#1617, #1618): 2.3-2.8 KB less text and 8,952 octets
# less RAM. The alloc rows are from when that image was added (#1635).

[thumbv7m-none-eabi.mstp]
text = 18448
rodata = 1136
data = 64
bss = 6224
flash = 20720
ram = 6224
fmt_functions = 0
div64_functions = 0

